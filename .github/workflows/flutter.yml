name: Flutter
on: [push, pull_request]
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub lib
      - run: flutter test --no-pub test/partida/reglas_partida_test.dart test/contenido/utf8_test.dart
