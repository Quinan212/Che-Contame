name: contame_android
description: "Un juego argentino de cartas para conversar y conocerse."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  audioplayers: ^6.8.1

dev_dependencies:
  audioplayers_platform_interface: ^7.2.0
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/contenido/preguntas-base.json
    - assets/contenido/politica-privacidad.txt
    - assets/imagenes/conversation-background-v2.png
    - assets/imagenes/marcas-naranjas.png
    - assets/imagenes/che-preguntame-logo.png
    - assets/imagenes/che-simbolo-v11.png
    - assets/sonidos/
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fuentes/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fuentes/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fuentes/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fuentes/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fuentes/Outfit-ExtraBold.ttf
          weight: 800
    - family: PhosphorBold
      fonts:
        - asset: assets/fuentes/Phosphor-Bold.ttf
